name: Markdownlint

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: markdownlint-${{ github.ref }}
  cancel-in-progress: true

# Temporary pause for the listed refactor drafts; non-draft behavior is unchanged.
jobs:
  markdownlint:
    if: ${{ github.event_name != 'pull_request' || !contains(fromJSON('["review/refactor-core-upstream44","review/refactor-projection-upstream44","review/refactor-integration-upstream44","review/refactor-native-upstream44","review/refactor-codex-upstream44","review/refactor-cursor-upstream44","review/refactor-kiro-cli-upstream44","review/refactor-kiro-v3-upstream44","review/refactor-copilot-upstream44","review/refactor-opencode-upstream44","review/refactor-completion-upstream44","review/refactor-attempt-upstream44","review/refactor-qualified-ci-upstream44","review/refactor-runtime-upstream44","review/refactor-host-root-upstream44","review/refactor-ci-tests-upstream44","review/refactor-hook-plan-upstream44"]'), github.head_ref) || !github.event.pull_request.draft }}
    name: Root documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v22.0.0
        with:
          globs: |
            AGENTS.md
            CLAUDE.md
            CODE_OF_CONDUCT.md
            CONTRIBUTING.md
            DEVELOPERS.md
            README.md
