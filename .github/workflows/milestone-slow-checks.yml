name: Milestone slow checks
run-name: Milestone ${{ inputs.milestone }} / ${{ inputs.source_sha }}

# Deliberately not reusable and never automatic: reserve this for a named unblock.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full immutable commit SHA reachable in this fork
        required: true
        type: string
      milestone:
        description: Named milestone or blocking question this run will resolve
        required: true
        type: string

permissions:
  contents: read

# Serialize rare runs without discarding evidence from the one already running.
concurrency:
  group: aidlc-milestone-slow-checks
  cancel-in-progress: false

jobs:
  deterministic:
    name: Linux / bounded smoke, unit and integration
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'HailsTails/aidlc-workflows' &&
      github.event.repository.visibility == 'public' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 175
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      MILESTONE: ${{ inputs.milestone }}
      CONTROLLER_SHA: ${{ github.workflow_sha }}
      CONTROLLER_REF: ${{ github.workflow_ref }}
      AIDLC_NO_LLM: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - name: Validate manual request
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || {
            echo '::error::Use a full lowercase commit SHA, not a branch or tag'
            exit 2
          }
          [[ "$MILESTONE" =~ ^[A-Za-z0-9][A-Za-z0-9[:space:]_./:()-]{0,179}$ ]] || {
            echo '::error::Name a milestone in 1-180 plain-text characters'
            exit 2
          }

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        id: checkout
        timeout-minutes: 10
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind source and runner identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          mkdir -p tmp/ci-milestone
          {
            printf 'milestone=%s\nsource_sha=%s\ncontroller_sha=%s\ncontroller_ref=%s\n' \
              "$MILESTONE" "$SOURCE_SHA" "$CONTROLLER_SHA" "$CONTROLLER_REF"
            printf 'source_tree=%s\n' "$(git rev-parse HEAD^{tree})"
            printf 'runner=%s / %s / %s\n' "$RUNNER_OS" "$RUNNER_ARCH" "${ImageVersion:-unknown}"
            printf 'command=bun tests/run-tests.ts --no-llm --parallel 4 --verbose --file-retries 0 --run-timeout 8100\n'
            printf 'scope=smoke + unit + integration; fixture guards; no E2E, live models or release qualification\n'
            uname -a
            bash --version | head -1
            git --version
            sha256sum tests/run-tests.ts tests/harness/runner-profile.ts \
              tests/lib/e2e-workers.ts scripts/package.ts scripts/ci-sanitize-logs.ts bun.lock
          } | tee tmp/ci-milestone/identity.txt

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        id: bun
        timeout-minutes: 10
        with:
          bun-version: '1.4.4'

      - name: Prepare ordinary Linux test substrates
        timeout-minutes: 10
        run: |
          set -euo pipefail
          missing=()
          for tool in tmux zsh; do
            command -v "$tool" >/dev/null 2>&1 || missing+=("$tool")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq "${missing[@]}"
          fi
          { bun --version; tmux -V; zsh --version; } | tee -a tmp/ci-milestone/identity.txt

      - name: Install locked dependencies
        timeout-minutes: 10
        run: bun install --frozen-lockfile

      # Use the candidate's runner, packaging and selection unchanged. The
      # 135-minute runner work budget leaves cleanup time inside this step.
      - name: Run the bounded milestone suite
        id: suite
        timeout-minutes: 145
        run: |
          set -euo pipefail
          start=$(date +%s)
          # Keep raw output locally, but send only redacted lines to Actions as
          # they arrive. Received console lines survive loss of this machine;
          # buffered output and per-file logs do not have that guarantee.
          token="$(cat /proc/sys/kernel/random/uuid)"
          echo "::stop-commands::$token"
          set +e
          bun tests/run-tests.ts --no-llm --parallel 4 --verbose \
            --file-retries 0 --run-timeout 8100 2>&1 \
            | tee tmp/ci-milestone/run.log \
            | bun -e '
              import { createInterface } from "node:readline";
              import { writeSync } from "node:fs";
              import { redactSecrets } from "./scripts/ci-sanitize-logs.ts";
              const started = Date.now();
              const emit = (line) => writeSync(1, line + "\n");
              const heartbeat = setInterval(() => {
                emit(`[milestone] ${Math.floor((Date.now() - started) / 1000)}s elapsed; waiting for runner output or exit, not a completion result.`);
              }, 60000);
              try {
                for await (const line of createInterface({ input: process.stdin, crlfDelay: Infinity })) {
                  emit(redactSecrets(line));
                }
              } catch {
                // Never print an exception that might contain unsanitized input.
                emit("[milestone] Live log sanitization/stream failed; this is not a pass.");
                process.exitCode = 1;
              } finally {
                clearInterval(heartbeat);
              }
            '
          statuses=("${PIPESTATUS[@]}")
          set -e
          echo "::$token::"
          result=${statuses[0]}
          printf 'runner_exit=%s raw_log_exit=%s live_stream_exit=%s\n' "${statuses[@]}"
          if [ "${statuses[1]}" -ne 0 ] || [ "${statuses[2]}" -ne 0 ]; then
            echo '::error::Milestone evidence stream failed; this is not a pass'
            if [ "$result" -eq 0 ]; then result=1; fi
          fi
          printf 'exit_code=%s\nelapsed_seconds=%s\n' "$result" "$(( $(date +%s) - start ))" \
            > tmp/ci-milestone/result.txt
          stamp="$(sed -n '/^Verbose mode: logging to /{s/^Verbose mode: logging to //;p;q;}' tmp/ci-milestone/run.log | tr -d '\r')"
          case "$stamp" in
            "$PWD"/tests/logs/*)
              if [ -f "$stamp/summary.txt" ]; then
                cp "$stamp/summary.txt" tmp/ci-milestone/summary.txt
              fi
              ;;
          esac
          if [ ! -f tmp/ci-milestone/summary.txt ]; then
            echo '::error::Runner did not finish with a summary; this is not a pass'
            if [ "$result" -eq 0 ]; then result=1; fi
          fi
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo '::error::Tracked candidate files changed during the run'
            git status --short --untracked-files=no > tmp/ci-milestone/source-changes.txt
            if [ "$result" -eq 0 ]; then result=1; fi
          fi
          exit "$result"

      - name: Publish bounded sanitized diagnostics in the run log
        if: ${{ always() && steps.checkout.outcome == 'success' && steps.bun.outcome == 'success' }}
        timeout-minutes: 5
        env:
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
          AIDLC_NIGHTLY_UPLOAD_TRACES: '0'
        run: |
          set -euo pipefail
          # No artifact or cache uploads: avoid an extra storage budget.
          bun scripts/ci-sanitize-logs.ts tmp/ci-milestone
          token="$(cat /proc/sys/kernel/random/uuid)"
          echo "::stop-commands::$token"
          for file in identity.txt result.txt source-changes.txt summary.txt; do
            if [ -f "tmp/ci-milestone/$file" ]; then
              printf '\n--- %s ---\n' "$file"
              head -c 262144 "tmp/ci-milestone/$file"
            fi
          done
          if [ -f tmp/ci-milestone/run.log ]; then
            printf '\n--- Last 256 KiB of sanitized runner output ---\n'
            tail -c 262144 tmp/ci-milestone/run.log
          fi
          echo "::$token::"
          {
            printf '## Milestone slow checks\n\n'
            printf 'Milestone: %s\n\nSource: %s\n\nController: %s\n\n' \
              "$MILESTONE" "$SOURCE_SHA" "$CONTROLLER_SHA"
            printf 'Suite step: %s. See the diagnostics step for the retained summary and exclusions.\n\n' "$SUITE_OUTCOME"
            printf 'Linux smoke/unit/integration only, fixture guards, no live models, zero file retries.\n'
            printf 'No claim of E2E, other platforms, the full CI gate, release qualification or a baseline comparison.\n'
          } >> "$GITHUB_STEP_SUMMARY"
