name: Rin CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: Source checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check authored source and tests
        run: bunx tsc --noEmit -p tsconfig.json && bunx tsc --noEmit -p tsconfig.tests.json
      - name: Lint authored source
        run: bun run lint
      - name: Audit reusable Rin plugin
        run: bun run audit:rin
