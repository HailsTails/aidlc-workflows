name: Rin CI

# Verification only. Nothing here builds a release, tags, publishes a package,
# deploys documentation, uploads an artifact or calls a model; publishing is not
# decided for this fork. Every job reads the repository and nothing else.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: Source checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate distributions imported by source and test checks
        run: bun scripts/package.ts
      - name: Type check authored source and tests
        run: bun run typecheck
      - name: Lint authored source
        run: bun run lint
      - name: Audit reusable Rin plugin
        run: bun run audit:rin
      - name: Verify inherited Rin debt decays on touch
        run: bun plugins/rin/tools/rin-harness-carve-out-decay.ts --project-dir . --base-ref "${{ github.event.pull_request.base.sha || 'origin/main' }}"

  determinism:
    name: Package determinism
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Two clean builds in independent temp roots, byte-compared.
      - name: Build twice and compare
        run: bun scripts/package.ts --check

  tests:
    name: Tests (${{ matrix.suite.name }})
    runs-on: ubuntu-latest
    # Backstops, not targets: the first runs on this fork set real figures.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        suite:
          - {name: smoke, args: '--smoke'}
          - {name: unit-1, args: '--unit --shard 1/8'}
          - {name: unit-2, args: '--unit --shard 2/8'}
          - {name: unit-3, args: '--unit --shard 3/8'}
          - {name: unit-4, args: '--unit --shard 4/8'}
          - {name: unit-5, args: '--unit --shard 5/8'}
          - {name: unit-6, args: '--unit --shard 6/8'}
          - {name: unit-7, args: '--unit --shard 7/8'}
          - {name: unit-8, args: '--unit --shard 8/8'}
          - {name: integration, args: '--integration -P 4 --exclude ^t-(scope-run|guard-matrix)-'}
          - {name: scope-runs, args: '--integration -P 4 --filter ^t-scope-run-'}
          - {name: guard-matrix, args: '--integration -P 4 --filter ^t-guard-matrix-'}
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Install terminal substrates used by unit tests
        run: |
          missing=()
          for tool in tmux zsh; do
            command -v "$tool" >/dev/null 2>&1 || missing+=("$tool")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq "${missing[@]}"
          fi
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build the harness projections
        run: bun scripts/package.ts
      # --no-llm closes every live-model gate; deterministic tests still run.
      - name: Run tests
        env:
          SUITE_ARGS: ${{ matrix.suite.args }}
        run: |
          read -r -a args <<< "$SUITE_ARGS"
          bash tests/run-tests.sh --no-llm "${args[@]}"

  rin-plugin:
    name: Rin plugin suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build the harness projections
        run: bun scripts/package.ts
      - name: Plugin tests
        run: bun run test:rin
      - name: Derivation self-test
        run: bun run test:rin:selftest

  gitleaks:
    name: Gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan repository history
        env:
          SCAN_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          gitleaks git \
            --config=.gitleaks.toml \
            --baseline-path=.gitleaks-baseline.json \
            --log-opts="$SCAN_REF" \
            --redact \
            .

  semgrep:
    name: Semgrep (authored TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SEMGREP_VERSION: "1.157.0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: python -m pip install "semgrep==${SEMGREP_VERSION}"
      - name: Scan authored TypeScript
        run: |
          semgrep scan \
            --oss-only \
            --metrics=off \
            --config=p/typescript \
            --severity=ERROR \
            --error \
            core harness scripts plugins
