name: Rin CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discipline-core-windows:
    name: Discipline core on Windows
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check discipline core
        run: bun run --cwd plugins/discipline-core check
      - name: Prove a discipline core install
        shell: bash
        run: bun run --cwd plugins/discipline-core install-proof

  source-checks:
    name: Source checks
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check discipline core
        run: bun run --cwd plugins/discipline-core check
      - name: Prove a discipline core install
        run: bun run --cwd plugins/discipline-core install-proof
      - name: Generate distributions imported by source and test checks
        run: bun scripts/package.ts
      - name: Type check authored source and tests
        run: bun run typecheck
      - name: Lint authored source
        run: bun run lint
      - name: Audit reusable Rin plugin
        run: bun run audit:rin
      - name: Verify inherited Rin debt decays on touch
        run: bun plugins/rin/tools/rin-harness-carve-out-decay.ts --project-dir . --base-ref "${{ github.event.pull_request.base.sha || 'origin/main' }}"
