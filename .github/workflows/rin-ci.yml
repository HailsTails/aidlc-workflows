name: Rin CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hone-windows:
    name: Hone on Windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prove rin's Hone check resolution against the pinned @hailstails/hone release
        run: bun run test:rin:hone

  source-checks:
    name: Source checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate distributions imported by source and test checks
        run: bun scripts/package.ts
      - name: Type check authored source and tests
        run: bun run typecheck
      - name: Lint authored source
        run: bun run lint
      - name: Audit reusable Rin plugin
        run: bun run audit:rin
      - name: Verify inherited Rin debt decays on touch
        run: bun plugins/rin/tools/rin-harness-carve-out-decay.ts --project-dir . --base-ref "${{ github.event.pull_request.base.sha || 'origin/main' }}"
      - name: Check the fork against its selected disciplines with the pinned @hailstails/hone release
        run: bun run --silent hone:check --base-revision "${{ github.event.pull_request.base.sha || 'origin/main' }}"
